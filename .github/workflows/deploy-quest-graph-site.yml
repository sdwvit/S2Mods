name: deploy-quest-graph-site

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-quest-graph-site.yml"
      - "package.json"
      - "src/build-quest-graph-example.cfg"
      - "src/build-quest-graph-site.mts"
      - "src/quest-cfg-to-graph-html.mts"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build quest graph site
        run: pnpm run build-quest-graph-site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
