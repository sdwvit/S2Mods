name: build-nodebridge

on:
  workflow_dispatch:
  push:
    tags:
      - "nodebridge-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        working-directory: src/nodebridge
        run: cmake --preset windows-release

      - name: Build
        working-directory: src/nodebridge
        run: cmake --build --preset windows-release

      - name: Stage artifacts
        working-directory: src/nodebridge
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\bin\Release\dwmapi.dll dist\
          if (Test-Path build\bin\Release\dwmapi.pdb) {
            Copy-Item build\bin\Release\dwmapi.pdb dist\
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: nodebridge-dwmapi
          path: |
            src/nodebridge/dist/dwmapi.dll
            src/nodebridge/dist/dwmapi.pdb

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/nodebridge-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/nodebridge/dist/dwmapi.dll
            src/nodebridge/dist/dwmapi.pdb
