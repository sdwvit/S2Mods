name: build-nodebridge

on:
  workflow_dispatch:
  push:
    tags:
      - "nodebridge-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # No vcvars action needed: CMake's "Visual Studio 17 2022" generator
      # (see CMakePresets.json) locates MSVC on windows-latest without help
      # and cmake --build dispatches to MSBuild directly.

      - name: Configure CMake
        working-directory: src/nodebridge
        run: cmake --preset windows-release

      - name: Build
        working-directory: src/nodebridge
        run: cmake --build --preset windows-release

      - name: Stage artifacts
        working-directory: src/nodebridge
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\bin\Release\dwmapi.dll dist\
          if (Test-Path build\bin\Release\dwmapi.pdb) {
            Copy-Item build\bin\Release\dwmapi.pdb dist\
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v7
        with:
          name: nodebridge-dwmapi
          path: |
            src/nodebridge/dist/dwmapi.dll
            src/nodebridge/dist/dwmapi.pdb

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/nodebridge-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/nodebridge/dist/dwmapi.dll
            src/nodebridge/dist/dwmapi.pdb
